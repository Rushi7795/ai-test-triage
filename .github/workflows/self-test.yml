name: self-test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  parser:
    name: Parser unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run tests
        run: python3 tests/test_parser.py

  action:
    name: Action on sample failures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Triage the sample reports
        uses: ./
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          report-paths: 'tests/fixtures/*.xml'
          context: 'Sample fixtures used to self-test this action.'
